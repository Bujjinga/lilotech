<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lilotech library</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 60px; }
    header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    header .logo { font-size: 24px; }
    header .logo-mark { width: 40px; height: 40px; }
    .addbar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-bottom: 6px; }
    #addStatus { min-height: 20px; margin-bottom: 12px; }
    #addStatus.err { color: #c62828; }
    .layout { display: grid; grid-template-columns: 220px 1fr; gap: 22px; align-items: start; }
    aside { position: sticky; top: 16px; }
    aside h4 { margin: 4px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .nav { display: grid; gap: 2px; margin-bottom: 14px; }
    .nav button { border: 0; background: transparent; justify-content: space-between; width: 100%; padding: 6px 10px; }
    .nav button:hover { background: var(--soft); }
    .nav button.on { background: var(--soft); color: var(--accent); font-weight: 650; }
    .nav .n { font-size: 12px; color: var(--muted); }
    .nav .del { visibility: hidden; font-size: 12px; padding: 0 4px; }
    .nav button:hover .del { visibility: visible; }
    .tools { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-bottom: 14px; align-items: center; }
    .tools select { width: auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .card.new { animation: lg-letter .5s ease-out both; }
    .card .chips { margin-top: 10px; }
    details.f { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
    details.f summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
    .body { white-space: pre-wrap; margin: 6px 0 2px; }
    .empty-field { color: var(--muted); font-style: italic; }
    blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--accent); white-space: pre-wrap; }
    .actions { margin-top: 10px; }
    .empty { text-align: center; padding: 50px 20px; }
    .edit textarea { min-height: 90px; }
    .count { font-size: 13px; }
    #secTitle { font-size: 18px; margin: 0 0 10px; }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; }
      .addbar, .tools { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div id="logo"></div>
      <span class="count muted" id="count"></span>
      <span class="spacer"></span>
      <label for="style" style="margin:0">Citation style</label>
      <select id="style" class="style-pick"></select>
    </header>

    <form class="addbar" id="addForm">
      <input type="text" inputmode="url" autocomplete="off" spellcheck="false" id="link" placeholder="Paste a paper link, DOI (10.xxxx/…) or arXiv ID to save it" aria-label="Paper link">
      <button class="primary" id="addLink">Add paper</button>
      <button type="button" id="addPdf" title="Choose PDF files from your computer">Add a PDF</button>
      <input type="file" id="pdfFile" accept=".pdf,application/pdf" multiple hidden>
    </form>
    <div id="addStatus" class="small muted"></div>

    <div class="layout">
      <aside>
        <h4>Sections</h4>
        <nav class="nav" id="nav"></nav>
        <form id="newSecForm"><input type="text" id="newSec" placeholder="+ New section" aria-label="New section name"></form>
      </aside>

      <main>
        <h2 id="secTitle"></h2>
        <div class="tools">
          <input type="search" id="q" placeholder="Search titles, authors, abstracts, notes…">
          <select id="sort" aria-label="Sort">
            <option value="new">Newest first</option>
            <option value="az">Reference list order</option>
          </select>
          <details class="menu" id="exportMenu">
            <summary class="btn">Export</summary>
            <div class="menu-list">
              <button id="copyAll">Copy all references</button>
              <button id="exWord">Download for Word (.doc)</button>
              <button id="exMd">Download notes (.md)</button>
              <button id="exBib">Download BibTeX (.bib)</button>
              <button id="exRis">Download for Zotero, Mendeley, EndNote (.ris)</button>
              <button id="exCsv">Download spreadsheet (.csv)</button>
              <hr>
              <button id="exJson" title="Save a backup file of your whole library">Backup library</button>
              <button id="imJson" title="Load a backup file">Restore from backup</button>
            </div>
          </details>
          <input type="file" id="file" accept=".json,application/json" hidden>
        </div>
        <div id="list"></div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script type="module" src="library.js"></script>
</body>
</html>
